<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <!-- 紫色渐变背景 -->
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:1" />
    </linearGradient>

    <!-- 云雾水墨效果 -->
    <radialGradient id="cloudWash" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:0" />
    </radialGradient>

    <!-- 朱砂红印章渐变 -->
    <linearGradient id="sealRed4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DC2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B91C1C;stop-opacity:1" />
    </linearGradient>

    <!-- 轿车渐变 -->
    <linearGradient id="carGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5B21B6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4C1D95;stop-opacity:1" />
    </linearGradient>

    <!-- 车窗渐变 -->
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#A78BFA;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:0.6" />
    </linearGradient>
  </defs>

  <!-- 背景渐变 -->
  <rect width="1080" height="1080" fill="url(#purpleGradient)" />

  <!-- 云雾水墨晕染 -->
  <ellipse cx="200" cy="200" rx="350" ry="250" fill="url(#cloudWash)" opacity="0.7" />
  <ellipse cx="880" cy="880" rx="380" ry="280" fill="url(#cloudWash)" opacity="0.6" />
  <ellipse cx="540" cy="540" rx="420" ry="320" fill="url(#cloudWash)" opacity="0.5" />

  <!-- 云雾装饰 -->
  <g opacity="0.25" fill="#EDE9FE">
    <path d="M100,150 Q130,120 160,150 Q190,120 220,150 Q250,120 280,150 Q250,180 220,150 Q190,180 160,150 Q130,180 100,150 Z" />
    <path d="M800,850 Q830,820 860,850 Q890,820 920,850 Q950,820 980,850 Q950,880 920,850 Q890,880 860,850 Q830,880 800,850 Z" />
    <path d="M50,700 Q80,670 110,700 Q140,670 170,700 Q140,730 110,700 Q80,730 50,700 Z" />
    <path d="M910,280 Q940,250 970,280 Q1000,250 1030,280 Q1000,310 970,280 Q940,310 910,280 Z" />
  </g>

  <!-- 核心元素：轿车 -->
  <g transform="translate(200, 480)">
    <!-- 车身主体 -->
    <path d="M50,180 L50,150 Q50,120 100,110 L550,110 Q600,120 600,150 L600,180 Q600,200 580,200 L70,200 Q50,200 50,180 Z"
          fill="url(#carGradient)" stroke="#4C1D95" stroke-width="4" />

    <!-- 车顶 -->
    <path d="M150,110 Q200,50 400,50 Q500,50 550,110"
          fill="url(#carGradient)" stroke="#4C1D95" stroke-width="4" />

    <!-- 前窗 -->
    <path d="M155,108 Q200,55 320,55 L320,108 Z"
          fill="url(#windowGrad)" stroke="#6D28D9" stroke-width="2" />

    <!-- 后窗 -->
    <path d="M545,108 Q500,55 380,55 L380,108 L545,108 Z"
          fill="url(#windowGrad)" stroke="#6D28D9" stroke-width="2" />

    <!-- 前轮 -->
    <circle cx="150" cy="200" r="45" fill="#1F2937" stroke="#111827" stroke-width="6" />
    <circle cx="150" cy="200" r="30" fill="#374151" />
    <circle cx="150" cy="200" r="12" fill="#6B7280" />

    <!-- 后轮 -->
    <circle cx="500" cy="200" r="45" fill="#1F2937" stroke="#111827" stroke-width="6" />
    <circle cx="500" cy="200" r="30" fill="#374151" />
    <circle cx="500" cy="200" r="12" fill="#6B7280" />

    <!-- 车灯 -->
    <ellipse cx="595" cy="155" rx="8" ry="12" fill="#FEF3C7" opacity="0.9" />
    <ellipse cx="55" cy="155" rx="8" ry="12" fill="#FCA5A5" opacity="0.9" />

    <!-- 车门线 -->
    <line x1="325" y1="115" x2="325" y2="195" stroke="#6D28D9" stroke-width="2" opacity="0.5" />

    <!-- 门把手 -->
    <rect x="270" y="150" width="20" height="6" rx="2" fill="#6D28D9" />
    <rect x="360" y="150" width="20" height="6" rx="2" fill="#6D28D9" />

    <!-- 后视镜 -->
    <ellipse cx="140" cy="105" rx="15" ry="10" fill="#4C1D95" stroke="#5B21B6" stroke-width="2" />
    <ellipse cx="510" cy="105" rx="15" ry="10" fill="#4C1D95" stroke="#5B21B6" stroke-width="2" />

    <!-- 装饰线条 -->
    <path d="M60,170 L590,170" stroke="#7C3AED" stroke-width="2" opacity="0.4" />
  </g>

  <!-- 平稳行驶线条 -->
  <g opacity="0.3">
    <path d="M200,750 L850,750" stroke="#EDE9FE" stroke-width="2" />
    <path d="M200,770 L850,770" stroke="#EDE9FE" stroke-width="2" />
    <path d="M200,790 L850,790" stroke="#EDE9FE" stroke-width="2" />
  </g>

  <!-- 左上角朱砂红印章 -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="120" height="120" rx="8" ry="8"
          fill="url(#sealRed4)" stroke="#991B1B" stroke-width="3" />
    <rect x="10" y="10" width="100" height="100" rx="4" ry="4"
          fill="none" stroke="#FCA5A5" stroke-width="2" opacity="0.6" />

    <text x="60" y="55" font-family="'Noto Serif SC', serif" font-size="36"
          font-weight="bold" fill="#FEF2F2" text-anchor="middle" dominant-baseline="middle">
      高级
    </text>

    <circle cx="20" cy="20" r="3" fill="#FEF2F2" opacity="0.8" />
    <circle cx="100" cy="20" r="3" fill="#FEF2F2" opacity="0.8" />
    <circle cx="20" cy="100" r="3" fill="#FEF2F2" opacity="0.8" />
    <circle cx="100" cy="100" r="3" fill="#FEF2F2" opacity="0.8" />
  </g>

  <!-- 右下角半透明"证道"水印 -->
  <g transform="translate(830, 830)" opacity="0.25">
    <text x="125" y="70" font-family="'Noto Serif SC', serif" font-size="80"
          font-weight="bold" fill="#4C1D95" text-anchor="middle" writing-mode="tb">
      证道
    </text>
    <rect x="10" y="10" width="230" height="120" rx="5" ry="5"
          fill="none" stroke="#4C1D95" stroke-width="3" />
  </g>

  <!-- 等级标识 -->
  <g transform="translate(540, 950)">
    <text x="0" y="0" font-family="'Noto Serif SC', serif" font-size="48"
          font-weight="bold" fill="#5B21B6" text-anchor="middle">
      LEVEL 4
    </text>
    <text x="0" y="50" font-family="'Noto Serif SC', serif" font-size="32"
          fill="#7C3AED" text-anchor="middle">
      四轮领航员
    </text>
  </g>

  <!-- 外边框 -->
  <rect x="10" y="10" width="1060" height="1060" rx="20" ry="20"
        fill="none" stroke="#7C3AED" stroke-width="5" opacity="0.6" />
</svg>