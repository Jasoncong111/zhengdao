<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <!-- 绿色渐变背景 -->
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34D399;stop-opacity:1" />
    </linearGradient>

    <!-- 竹叶水墨效果 -->
    <radialGradient id="bambooWash" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:0" />
    </radialGradient>

    <!-- 朱砂红印章渐变 -->
    <linearGradient id="sealRed2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DC2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B91C1C;stop-opacity:1" />
    </linearGradient>

    <!-- 小黄车渐变 -->
    <linearGradient id="bikeYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景渐变 -->
  <rect width="1080" height="1080" fill="url(#greenGradient)" />

  <!-- 竹叶水墨晕染 -->
  <ellipse cx="150" cy="850" rx="280" ry="200" fill="url(#bambooWash)" opacity="0.6" transform="rotate(-30, 150, 850)" />
  <ellipse cx="930" cy="150" rx="250" ry="180" fill="url(#bambooWash)" opacity="0.5" transform="rotate(20, 930, 150)" />
  <ellipse cx="540" cy="540" rx="350" ry="250" fill="url(#bambooWash)" opacity="0.4" />

  <!-- 竹叶装饰 -->
  <g opacity="0.3">
    <path d="M100,100 Q120,80 140,100" stroke="#065F46" stroke-width="3" fill="none" />
    <path d="M110,90 L130,95 L105,105 Z" fill="#065F46" />

    <path d="M950,900 Q970,880 990,900" stroke="#065F46" stroke-width="3" fill="none" />
    <path d="M960,890 L980,895 L955,905 Z" fill="#065F46" />

    <path d="M50,600 Q70,580 90,600" stroke="#065F46" stroke-width="2" fill="none" />
    <path d="M60,590 L80,595 L55,605 Z" fill="#065F46" />
  </g>

  <!-- 核心元素：小黄车（共享单车） -->
  <g transform="translate(290, 420)">
    <!-- 后轮 -->
    <circle cx="100" cy="250" r="70" fill="none" stroke="#1F2937" stroke-width="8" />
    <circle cx="100" cy="250" r="60" fill="none" stroke="#374151" stroke-width="2" />
    <circle cx="100" cy="250" r="15" fill="#374151" />

    <!-- 前轮 -->
    <circle cx="400" cy="250" r="70" fill="none" stroke="#1F2937" stroke-width="8" />
    <circle cx="400" cy="250" r="60" fill="none" stroke="#374151" stroke-width="2" />
    <circle cx="400" cy="250" r="15" fill="#374151" />

    <!-- 车架 -->
    <path d="M100,250 L180,150 L350,150 L400,250" stroke="#374151" stroke-width="8" fill="none" stroke-linejoin="round" />
    <path d="M180,150 L180,250" stroke="#374151" stroke-width="6" />
    <path d="M350,150 L350,200" stroke="#374151" stroke-width="6" />

    <!-- 车座 -->
    <ellipse cx="180" cy="130" rx="30" ry="10" fill="url(#bikeYellow)" stroke="#1F2937" stroke-width="3" />

    <!-- 车把 -->
    <path d="M350,200 L350,170" stroke="#374151" stroke-width="6" />
    <path d="M330,160 L370,160" stroke="#374151" stroke-width="6" stroke-linecap="round" />

    <!-- 踏板 -->
    <circle cx="180" cy="250" r="15" fill="#4B5563" />
    <rect x="165" y="255" width="30" height="8" rx="2" fill="#374151" />

    <!-- 链条盒 -->
    <rect x="140" y="220" width="80" height="25" rx="5" fill="#4B5563" opacity="0.8" />

    <!-- 车筐 -->
    <path d="M300,130 L380,130 L370,100 L310,100 Z" fill="none" stroke="#1F2937" stroke-width="3" />
    <line x1="310" y1="110" x2="310" y2="140" stroke="#1F2937" stroke-width="2" />
    <line x1="330" y1="105" x2="330" y2="140" stroke="#1F2937" stroke-width="2" />
    <line x1="350" y1="105" x2="350" y2="140" stroke="#1F2937" stroke-width="2" />
    <line x1="370" y1="110" x2="370" y2="140" stroke="#1F2937" stroke-width="2" />
  </g>

  <!-- 扫码图标装饰 -->
  <g transform="translate(750, 500)" opacity="0.6">
    <rect x="0" y="0" width="60" height="60" fill="none" stroke="#FEF3C7" stroke-width="4" />
    <rect x="10" y="10" width="15" height="15" fill="#FEF3C7" />
    <rect x="35" y="10" width="15" height="15" fill="#FEF3C7" />
    <rect x="10" y="35" width="15" height="15" fill="#FEF3C7" />
    <rect x="35" y="35" width="15" height="15" fill="#FEF3C7" />
  </g>

  <!-- 动感线条 -->
  <g opacity="0.4">
    <path d="M200,750 Q250,740 300,750" stroke="#ECFDF5" stroke-width="4" fill="none" />
    <path d="M220,770 Q270,760 320,770" stroke="#ECFDF5" stroke-width="3" fill="none" />
    <path d="M240,790 Q290,780 340,790" stroke="#ECFDF5" stroke-width="2" fill="none" />
  </g>

  <!-- 左上角朱砂红印章 -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="120" height="120" rx="8" ry="8"
          fill="url(#sealRed2)" stroke="#991B1B" stroke-width="3" />
    <rect x="10" y="10" width="100" height="100" rx="4" ry="4"
          fill="none" stroke="#FCA5A5" stroke-width="2" opacity="0.6" />

    <text x="60" y="55" font-family="'Noto Serif SC', serif" font-size="36"
          font-weight="bold" fill="#FEF2F2" text-anchor="middle" dominant-baseline="middle">
      进阶
    </text>

    <circle cx="20" cy="20" r="3" fill="#FEF2F2" opacity="0.8" />
    <circle cx="100" cy="20" r="3" fill="#FEF2F2" opacity="0.8" />
    <circle cx="20" cy="100" r="3" fill="#FEF2F2" opacity="0.8" />
    <circle cx="100" cy="100" r="3" fill="#FEF2F2" opacity="0.8" />
  </g>

  <!-- 右下角半透明"证道"水印 -->
  <g transform="translate(830, 830)" opacity="0.25">
    <text x="125" y="70" font-family="'Noto Serif SC', serif" font-size="80"
          font-weight="bold" fill="#064E3B" text-anchor="middle" writing-mode="tb">
      证道
    </text>
    <rect x="10" y="10" width="230" height="120" rx="5" ry="5"
          fill="none" stroke="#064E3B" stroke-width="3" />
  </g>

  <!-- 等级标识 -->
  <g transform="translate(540, 950)">
    <text x="0" y="0" font-family="'Noto Serif SC', serif" font-size="48"
          font-weight="bold" fill="#065F46" text-anchor="middle">
      LEVEL 2
    </text>
    <text x="0" y="50" font-family="'Noto Serif SC', serif" font-size="32"
          fill="#047857" text-anchor="middle">
      扫码骑士
    </text>
  </g>

  <!-- 外边框 -->
  <rect x="10" y="10" width="1060" height="1060" rx="20" ry="20"
        fill="none" stroke="#059669" stroke-width="5" opacity="0.6" />
</svg>